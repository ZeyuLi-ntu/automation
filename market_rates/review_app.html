<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利率人工复核</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui;color:#18394b;background:#eef3f5;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#123d50;color:white;padding:25px 4vw}h1{font-size:26px;margin:0 0 8px}header p{color:#d2e4eb;margin:5px 0}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 4vw;background:white;border-bottom:1px solid #d5e0e5;position:sticky;top:0;z-index:3}button,select,input,textarea{font:inherit;border:1px solid #b9cbd4;border-radius:6px;padding:9px}button{cursor:pointer;background:#166778;color:white;border:0}button.secondary{color:#154b60;background:#e8f1f5}button:disabled{opacity:.5;cursor:wait}a{color:#12687d}header a{color:white}main{max-width:1500px;margin:auto;padding:22px 4vw}.notice{padding:14px;background:#fff2d6;border-radius:7px;margin-bottom:18px}#status{white-space:pre-wrap}article{background:white;border:1px solid #ccdade;border-radius:9px;margin:16px 0;overflow:hidden}summary{cursor:pointer;padding:17px;font-weight:600;display:flex;justify-content:space-between;gap:10px}.badge{font-weight:400;font-size:13px;padding:4px 9px;border-radius:12px;background:#e6f3ea;color:#25603b}.bad{background:#fff0d6;color:#8c5300}.excluded{background:#ecedf0;color:#62646a}.content{border-top:1px solid #dde5e9;padding:20px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.lane{padding:14px;background:#f2f6f8;border-radius:6px;white-space:pre-wrap;line-height:1.7}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:20px 0}label{display:flex;flex-direction:column;gap:6px;font-size:13px}label.check{flex-direction:row;align-items:center;grid-column:span 2}textarea{min-height:80px;resize:vertical}.wide{grid-column:span 2}.full{grid-column:1/-1}.content>textarea{width:calc(50% - 10px);margin:8px 10px 10px 0;min-height:90px}summary::after{content:'展开';font-weight:400;font-size:12px;color:#6b8290;margin-left:auto;flex-shrink:0}details[open]>summary::after{content:'收起'}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.evidence{margin-top:18px;padding-top:14px;border-top:1px solid #ddd}.evidence pre{white-space:pre-wrap;max-height:330px;overflow:auto;background:#f7f8fa;padding:12px}.evidence img{max-width:100%;max-height:750px;object-fit:contain}.small{font-size:13px;color:#607985}#count{margin-right:auto}#history{font-size:13px;line-height:1.8;white-space:pre-wrap}footer{padding:20px;color:#607985}@media(max-width:850px){.fields{grid-template-columns:1fr 1fr}.pair{grid-template-columns:1fr}.bar{position:static}}
.pending{background:#e6eef8;color:#295e88}
</style>
<header><h1>利率人工复核</h1><p>核对证据 → 保存修正 → 重新生成两份表格 → 检查后登记历史底稿</p><p id="context"></p></header>
<div class="bar"><select id="bank" aria-label="银行筛选"><option value="">全部银行</option></select><select id="currency" aria-label="币种筛选"><option value="">全部币种</option></select><select id="rate-type" aria-label="类别筛选"><option value="">促销及挂牌</option><option value="promo">促销</option><option value="board">挂牌</option></select><select id="filter" aria-label="复核状态"><option value="all">全部报价</option><option value="disputed">两路有分歧</option><option value="pending">尚未人工确认</option><option value="edited">已人工处理</option><option value="excluded">暂不插表产品</option></select><input id="search" placeholder="搜索产品、期限、客群" aria-label="搜索"><span id="count"></span><button id="reload" class="secondary">刷新</button><button id="rebuild">重新生成两份表格</button></div>
<main><div class="notice" id="coverage-summary" hidden></div><div class="notice" id="status">原始提取和证据保留。保存修正后需要重新生成，Excel 中的汇总和排序才会同步。已排除的 BOC 新客户促销等产品不会因修正重新加入。</div><p><a id="report">打开当前调研表</a>　<a id="rainbow">打开当前彩虹表</a></p><details><summary>银行覆盖与待补信息</summary><div id="coverage"></div></details><div id="items"></div><details><summary>最近人工处理记录</summary><div id="history"></div></details></main>
<footer>金额、渠道等身份字段有分歧时可能显示两条记录：核实后保留正确条目，并排除错误条目。<br>本机入口 · 不自动确认历史底稿 · 资格或有效期改变时请重新核实</footer>
<script>
const token='__TOKEN__';let state,dirty=false;const dirtyCards=new Set();function changed(node){const id=node.closest('article')?.dataset.id||'add';dirtyCards.add(id);dirty=true}function saved(id){dirtyCards.delete(id);dirty=dirtyCards.size>0}const $=id=>document.getElementById(id);const labels={rate_pct:'利率（填 1.75 表示 1.75%）',product_name:'产品显示名',audience:'客群',channel:'渠道',amount_currency:'金额币种',amount_is_equivalent:'金额为等值要求',amount_min:'最低金额（见金额币种）',amount_max:'最高金额（空白表示未写明）',min_inclusive:'包含最低金额',max_inclusive:'包含最高金额',fresh_funds:'新资金要求',conditions:'完整条件／限制',valid_from:'生效日期',valid_to:'截止日期',rate_basis:'利率口径',availability:'提供状态',tenor_value:'实际期限数值',tenor_unit:'期限单位'};
const choices={channel:{unknown:'原文未写明／待核',online:'在线',branch:'分行','online_banking|sc_mobile':'网银 / SC Mobile',branch_or_online:'分行 / 在线',branch_or_mobile:'分行 / 手机',branch_or_instruction:'分行 / 指令表单',staff_instruction:'分行 / 客户经理指令',hlf_digital:'HLF Digital'},audience:{personal:'Personal',preferred:'Preferred',premier:'Premier',private:'Private',premier_elite:'Premier Elite',premier_wealth:'Premier（财富／FX资格）',premier_standard:'Premier（无财富持仓）',corporate:'Corporate（企业）',all:'全部客群',unknown:'待核'},fresh_funds:{yes:'要求新资金',no:'不要求新资金',unknown:'原文未写明／待核'},rate_basis:{annual_nominal:'名义年利率',effective:'有效年利率',step:'分段利率',unknown:'原文未写明（挂牌按%使用）'},availability:{available:'正在提供',withdrawn:'已证实停止提供',unknown:'待核'},tenor_unit:{M:'个月',D:'天'}};
function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function api(url,data){let r=await fetch(url,data?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(data)}:{});let v=await r.json();if(!r.ok)throw Error(v.error||'操作失败');return v}
function describe(r){if(!r)return '本路线未提取到该报价';return `${r.currency} ${r.rate_type==='board'?'挂牌':'促销'} · ${r.rate_pct??'-'}${r.rate_basis==='unknown'&&r.rate_type!=='board'?'（单位待核）':'%'} · ${r.tenor_value}${r.tenor_unit} · ${choices.audience[r.audience]??r.audience}\n${choices.channel[r.channel]??r.channel} · ${r.amount_currency||r.currency}${r.amount_is_equivalent?' 等值':''} ${r.min_inclusive?'≥':'>'}${r.amount_min??'未写明'} 至 ${r.max_inclusive?'≤':'<'}${r.amount_max??'未写明上限'}\n新资金：${choices.fresh_funds[r.fresh_funds]??r.fresh_funds}；有效期：${r.valid_from??'未写明'} 至 ${r.valid_to??'未写明'}\n${r.conditions}`}
function formField(key,value){let label=el('label',labels[key]);label.className=['conditions','product_name'].includes(key)?'wide':'';let input;if(choices[key]){input=el('select');for(let [v,t] of Object.entries(choices[key])){let op=el('option',t);op.value=v;input.append(op)}}else if(key==='conditions'){input=el('textarea')}else{input=el('input');input.type=['valid_from','valid_to'].includes(key)?'date':(key.endsWith('_inclusive')||key==='amount_is_equivalent')?'checkbox':'text'}input.dataset.field=key;if(input.type==='checkbox'){input.checked=!!value;label.className='check'}else{if(choices[key]&&value&&!choices[key][value])input.append(new Option(value,value));input.value=value??''};input.oninput=()=>changed(input);label.append(input);return label}
function additionForm(){if($('add-form'))return;let box=el('details');box.id='add-form';box.append(el('summary','补录当前范围内的报价'));let content=el('div',undefined,'content');box.append(content);let bank=el('select');bank.id='add-bank';bank.setAttribute('aria-label','补录银行');content.append(bank,el('p','补录仅适用于本次证据期，不自动延续。请先选择币种与产品，再按原文填写实际期限和金额币种。','small'));let scope=el('select');scope.id='add-catalog';scope.setAttribute('aria-label','补录币种与产品');content.append(scope);bank.onchange=()=>syncCatalog();scope.onchange=()=>{let c=state.catalog.find(c=>c.id===scope.value);if(c){fields.querySelector('[data-field=amount_currency]').value=c.amount_currency;changed(scope)}};let values={product_name:'人工补录定存报价',amount_currency:'SGD',amount_is_equivalent:false,rate_pct:'',audience:'personal',channel:'unknown',amount_min:null,amount_max:null,min_inclusive:true,max_inclusive:false,fresh_funds:'unknown',conditions:'',valid_from:null,valid_to:null,rate_basis:'annual_nominal',availability:'available',tenor_value:6,tenor_unit:'M'};let fields=el('div',undefined,'fields');for(let k of Object.keys(labels))fields.append(formField(k,values[k]));content.append(fields);let inputs={};for(let [key,title] of Object.entries({source_url:'来源网址（必填）',source_quote:'原文摘录／App 报价记录（必填）',author:'复核人（必填）',reason:'补录原因（必填）'})){let label=el('label',title),input=el(key==='source_quote'?'textarea':'input');input.setAttribute('aria-label',title);input.oninput=()=>changed(input);label.append(input);content.append(label);inputs[key]=input}let button=el('button','保存补录'),message=el('p');content.append(button,message);button.onclick=async()=>{button.disabled=true;try{let patch={};for(let input of fields.querySelectorAll('[data-field]')){let k=input.dataset.field,v=input.type==='checkbox'?input.checked:input.value.trim();if(['amount_min','amount_max','valid_from','valid_to','rate_pct'].includes(k)&&v==='')v=null;if(k==='tenor_value')v=Number(v);patch[k]=v}let doc={version:state.version,bank:bank.value,catalog_id:scope.value,fields:patch};for(let [k,v] of Object.entries(inputs))doc[k]=v.value;let saved=await api('/api/add',doc);state.version=saved.version;dirtyCards.delete('add');dirty=dirtyCards.size>0;message.textContent='补录已保存，请重新生成表格。';if(!dirty)await refresh()}catch(e){message.textContent=e.message}finally{button.disabled=false}};$('items').before(box)}
function syncCatalog(){let s=$('add-catalog'),old=s.value;let rows=state.catalog.filter(c=>c.bank===$('add-bank').value);s.replaceChildren(...rows.map(c=>new Option(`${c.currency} · ${c.rate_type==='board'?'挂牌':'促销'} · ${c.product_id}`,c.id)));if(rows.some(c=>c.id===old))s.value=old;let c=rows.find(c=>c.id===s.value);if(c)$('add-form').querySelector('[data-field=amount_currency]').value=c.amount_currency}
function render(){let bank=$('bank').value,filter=$('filter').value,query=$('search').value.toLowerCase();let rows=state.items.filter(i=>(!bank||i.bank===bank)&&(!$('currency').value||(i.presentation_currency||i.original.currency)===$('currency').value)&&(!$('rate-type').value||i.original.rate_type===$('rate-type').value)&&(!query||JSON.stringify(i.original).toLowerCase().includes(query))&&(filter==='all'||filter==='disputed'&&!i.agreed&&!i.decision||filter==='pending'&&!i.decision||filter==='edited'&&i.decision||filter==='excluded'&&i.excluded_by_policy));$('items').replaceChildren();$('count').textContent=`显示 ${rows.length} / ${state.items.length} 条`;
 for(let i of rows){let box=el('article'),d=el('details'),summary=el('summary');let r=i.effective||i.original;summary.append(el('span',`${i.bank} · ${i.presentation_currency||r.currency}${i.presentation_currency&&i.presentation_currency!==r.currency?'（原'+r.currency+'）':''} ${r.rate_type==='board'?'挂牌':'促销'} · ${r.product_name} · ${r.tenor_value}${r.tenor_unit} · ${r.rate_pct??'-'}${r.rate_basis==='unknown'&&r.rate_type!=='board'?'（单位待核）':'%'}`));summary.append(el('span',i.insertion_hold?'未插表：'+i.insertion_hold:i.excluded_by_policy?'规则排除，保留明细':i.decision?'已人工处理':i.carried_forward?'沿用上期修正，待本期复核':i.agreed?'自动核验通过，可在Excel检查':'两路分歧，必须人工处理','badge '+(i.excluded_by_policy?'excluded':!i.decision?(i.agreed?'pending':'bad'):'')));box.dataset.id=i.id;d.append(summary);box.append(d);$('items').append(box);let loaded=false;d.ontoggle=()=>{if(!d.open||loaded)return;loaded=true;let body=el('div',undefined,'content');d.append(body);let pair=el('div',undefined,'pair');for(let lane of ['llm','vlm']){let n=el('div',undefined,'lane');n.append(el('b',lane==='llm'?'文字提取':'截图提取'),el('div',i[lane].map(describe).join('\n\n')||'本路线缺失'));pair.append(n)}body.append(pair);let fields=el('div',undefined,'fields');for(let k of Object.keys(labels))fields.append(formField(k,r[k]));body.append(fields);
 let action=el('select');for(let [v,t] of Object.entries({replace:'采用表单修正值',confirm:'确认两路一致值',llm:'采用文字提取',vlm:'采用截图提取',exclude:'排除本期报价',reset:'撤销本条人工修正'})){let o=el('option',t);o.value=v;action.append(o)}
 let author=el('input');author.placeholder='复核人（必填）';author.value=sessionStorage.getItem('review-author')||'';author.setAttribute('aria-label','复核人');let reason=el('textarea');reason.placeholder='修正／确认原因（必填，写明核实的证据）';reason.setAttribute('aria-label','修正原因');let note=el('textarea');note.placeholder='表格中显示的人工备注（选填）';note.value=i.decision?.note||'';let persist=el('input');persist.type='checkbox';persist.checked=i.id.startsWith('manual-')?false:(i.decision?.persist??true);let lab=el('label',undefined,'check');lab.append(persist,'利率／产品显示名跨期沿用；资格与有效期修改时取消勾选');let save=el('button','保存本条');let msg=el('span',undefined,'small');let actions=el('div',undefined,'actions');actions.append(action,author,save,msg);body.append(reason,note,lab,actions);for(let input of [reason,note,author,action,persist])input.oninput=()=>changed(input);save.onclick=async()=>{save.disabled=true;try{let patch={};for(let input of fields.querySelectorAll('[data-field]')){let k=input.dataset.field,v=input.type==='checkbox'?input.checked:input.value.trim();if(['amount_min','amount_max','valid_from','valid_to','rate_pct'].includes(k)&&v==='')v=null;if(k==='tenor_value')v=Number(v);patch[k]=v}let result=await api('/api/save',{version:state.version,id:i.id,fingerprint:i.fingerprint,action:action.value,fields:patch,author:author.value,reason:reason.value,note:note.value,persist:!['exclude','reset'].includes(action.value)&&persist.checked});state.version=result.version;sessionStorage.setItem('review-author',author.value);saved(i.id);msg.textContent='已保存。重新生成后同步到两份表格。';i.decision={action:action.value,note:note.value,persist:persist.checked};i.effective=action.value==='replace'?{...r,...patch}:action.value==='llm'?i.llm[0]:action.value==='vlm'?i.vlm[0]:r;summary.lastElementChild.textContent='已人工处理';$('status').textContent='人工修正已保存；点击“重新生成两份表格”更新汇总与彩虹排序。'}catch(e){msg.textContent=e.message}finally{save.disabled=false}};
 for(let e of i.evidence){let ev=el('details',undefined,'evidence'),title=el('summary','查看原文与截图');ev.append(title);if(e.origin?.live_crawler_verified===false)ev.append(el('p','导入证据：文字独立取自官网，图片由用户提供，原始拍摄时间未知。本机自动采集尚未验证；完整条款仍待核。','notice'));let link=el('a','打开银行原网址');link.href=e.url;link.target='_blank';link.rel='noopener noreferrer';ev.append(link,el('pre',e.text));for(let src of e.images){let img=el('img');img.loading='lazy';img.src=src;img.alt=i.bank+' 官方页面证据';ev.append(img)}body.append(ev)}
 };}
}
async function showBoardCoverage(){
 const box=$('coverage-summary');box.hidden=true;
 if(!state.items.some(i=>(i.original||i.effective)?.rate_type==='board'))return;
 const base=state.report.slice(0,state.report.lastIndexOf('/')+1);
 try{const response=await fetch(base+'board-coverage.json');if(!response.ok)return;const c=await response.json();
  box.replaceChildren(el('b',`挂牌范围：应有 ${c.required_count} 组，当前表格有数值 ${c.pairs_with_numeric_output} 组，缺 ${c.missing_or_fully_held} 组。`));
  const link=el('a',' 查看完整缺失矩阵和原因');link.href=base+'board-coverage.html';link.target='_blank';box.append(link,el('div','人工尚未验收不等于没有数据。此统计对应当前已生成的工作簿；保存修正后需重新生成才会更新。','small'));box.hidden=false;
 }catch(e){box.hidden=true}
}
async function refresh(){try{state=await api('/api/state');let addBank=$('add-bank'),addSelected=addBank.value;addBank.replaceChildren(...state.banks.map(b=>new Option(b,b)));if(state.banks.includes(addSelected))addBank.value=addSelected;syncCatalog();let curr=$('currency').value;$('currency').replaceChildren(new Option('全部币种',''),...[...new Set(state.items.map(i=>i.presentation_currency||i.original.currency))].sort().map(c=>new Option(c,c)));$('currency').value=curr;let selected=$('bank').value;$('bank').replaceChildren(new Option('全部银行',''));for(let b of [...new Set(state.items.map(i=>i.bank))])$('bank').append(new Option(b,b));$('bank').value=selected;$('context').textContent=`汇编日期 ${state.as_of} · ${state.items.length} 条复核记录 · 修改记录版本 ${state.version}`;$('report').href=state.report;$('rainbow').href=state.rainbow;await showBoardCoverage();$('coverage').replaceChildren();for(let [b,date] of Object.entries(state.bank_dates))$('coverage').append(el('p',b+'：证据日期 '+date));for(let c of state.coverage)$('coverage').append(el('p',c.bank+'：'+c.reason));$('history').textContent=state.history.slice().reverse().map(h=>`${h.at}　${h.author}　${h.offer?.bank||''}　${h.action}　${h.reason}　${h.persist?'跨期沿用':'仅本次'}`).join('\n');if(state.job)$('status').textContent=state.job.message;render()}catch(e){$('status').textContent=e.message}}
for(let id of ['bank','currency','rate-type','filter','search'])$(id).oninput=()=>{if(dirty){$('status').textContent='请先保存正在编辑的条目，再切换筛选。';return}render()};$('reload').onclick=()=>{if(!dirty||confirm('有尚未保存的修改，确定刷新吗？')){dirty=false;dirtyCards.clear();refresh()}};$('rebuild').onclick=async()=>{try{if(dirty)throw Error('请先保存本条修改。');let job=await api('/api/regenerate',{version:state.version});$('status').textContent=job.message;$('rebuild').disabled=true;let timer=setInterval(async()=>{let s=await api('/api/state');$('status').textContent=s.job?.message||'';if(s.job?.status!=='running'){clearInterval(timer);$('rebuild').disabled=false;await refresh()}},5000)}catch(e){$('status').textContent=e.message}};window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};additionForm();refresh();
</script></html>
