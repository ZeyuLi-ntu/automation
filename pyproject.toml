[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-rate-research"
version = "0.1.0"
description = "Evidence-backed SGD deposit research with independent text and visual extraction"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["playwright>=1.50,<2", "PyMuPDF>=1.24,<2"]

[project.scripts]
market-rate = "market_rates.cli:main"

[tool.setuptools.packages.find]
include = ["market_rates*"]
